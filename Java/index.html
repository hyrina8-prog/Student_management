<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


        </head>
    <body>
        <div class="container">
            <h2 class="text-center my-5">Student Management</h2>

            <div class="d-flex align-items-center justify-content-between mb-4">
            <!-- Search container -->
            <div class="d-flex gap-3 align-items-center" style="width: 500px;">
                <input type="text" id="search" class="w-100 py-1 px-3 rounded-5">
                <button class="btn btn-success">Search</button>
            </div>

           <button
                data-bs-toggle="modal"
                data-bs-target="#productModal"
                onclick="openAddModal()"
                class="btn btn-success">
                Add Student
            </button>
        </div>

            <table class="table table-bordered">
                <thead>
                    <tr class="text-center">
                        <th>ID</th>
                        <th>Name</th>
                        <th>Code</th>
                        <th>Gender</th>
                        <th>Class</th>
                        <th>Major</th>
                        <th>GPA</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="show-products">
         </tbody>
        </table>
    </div>

                
                    <div class="modal" id="productModal" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Modal title</h5>
                                    <button type="button" class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    <form action id="form">
                                        <div class="my-3">
                                           <label for="" class="form-label">ID</label>
                                           <input type="text" id="id" class="form-control">
                                        </div>

                                        <div class="my-3">
                                            <label for="" class="form-label">Name</label>
                                            <input type="text" id="name" class="form-control">
                                        </div>

                                       <div class="my-3">
                                           <label for="code" class="form-label">Code</label>
                                           <input type="text" id="code" class="form-control">
                                        </div>

                                        <div class="my-3">
                                            <label for="gender" class="form-label">Gender</label>
                                            <select name="gender" id="gender" class="form-control">
                                                <option value="Male">Male</option>
                                                <option value="Female">Female</option>
                                            </select>
                                        </div>
                                        <div class="my-3">
                                            <label for="class" class="form-label">Class</label>
                                            <input type="text" id="class" class="form-control">
                                        </div>

                                        <div class="my-3">
                                            <label for="major" class="form-label">Major</label>
                                            <input type="text" id="major" class="form-control">
                                        </div>

                                        <div class="my-3">
                                            <label for="gpa" class="form-label">GPA</label>
                                            <input type="text" id="gpa" class="form-control">
                                        </div>

                                        <div class="my-3">
                                            <label for="image" class="form-label">Image</label>
                                            <input type="text" id="image" class="form-control">
                                            <img class="w-100" src="" id="previews-image" alt="">
                                        </div>

                                        <div class="modal-footer">
                                            <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal">Close</button>
                                            <button type="submit" id="save-btn"
                                                class="btn btn-primary"
                                                data-bs-dismiss="modal">Save
                                                changes</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

        <script src="/js.js"></script>
    </body>
</html>
